name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [pro, standard]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ qt6-base-dev libobs-dev \
            fonts-ipafont-gothic fonts-noto-color-emoji

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMODEL600_BUILD_TESTS=ON
          -DMODEL600_BUILD_GUI_SAMPLES=ON
          -DMODEL600_PRO_EDITION=${{ matrix.edition == 'pro' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Python tools sanity
        run: python3 setup_project.py --verify

      - name: Render GUI samples
        if: matrix.edition == 'pro'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '2'
        run: ./build/m600_render_gui_samples gui-samples-out

      - name: Upload GUI samples
        if: matrix.edition == 'pro'
        uses: actions/upload-artifact@v4
        with:
          name: gui-samples
          path: gui-samples-out/*.png

  # Windows (MSVC) and macOS (Apple Clang, Universal2): the full OBS plugin.
  # The libobs + obs-frontend-api SDK is built from the obs-studio sources with
  # the official obs-deps, as obsproject/obs-plugintemplate does
  # (tools/ci/obs_sdk.cmake), and cached. Every OBS-independent source is also
  # compiled with warnings as errors, then the tests and the real GUI run.
  desktop:
    name: ${{ matrix.os_name }} (${{ matrix.edition }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, os_name: Windows MSVC, edition: pro }
          - { os: windows-2022, os_name: Windows MSVC, edition: standard }
          - { os: macos-15, os_name: macOS Universal2, edition: pro }
          - { os: macos-15, os_name: macOS Universal2, edition: standard }
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        shell: bash
        run: |
          # One forward-slash path usable by CMake, MSVC tools and bash alike.
          root="$(cd "$GITHUB_WORKSPACE/.." && pwd)/obs-sdk"
          if [ "$RUNNER_OS" = "Windows" ]; then root="$(cygpath -m "$root")"; fi
          echo "OBS_SDK=$root" >> "$GITHUB_ENV"

      - name: Cache OBS SDK
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OBS_SDK }}
          key: obs-sdk-${{ runner.os }}-${{ hashFiles('tools/ci/obs_sdk.cmake') }}

      - name: Build OBS SDK (libobs + obs-frontend-api)
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cmake -DOUT="$OBS_SDK" -P tools/ci/obs_sdk.cmake

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          PREFIX="$OBS_SDK/sdk;$OBS_SDK/deps;$OBS_SDK/qt6"
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
            # libobs installs as sdk/Frameworks/libobs.framework on macOS.
            PREFIX="$PREFIX;$OBS_SDK/sdk/Frameworks"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA \
            "-DCMAKE_PREFIX_PATH=$PREFIX" \
            -DMODEL600_BUILD_PLUGIN=ON \
            -DMODEL600_BUILD_PORTABLE_CHECK=ON \
            -DMODEL600_BUILD_TESTS=ON \
            -DMODEL600_BUILD_GUI_SAMPLES=ON \
            -DMODEL600_PRO_EDITION=${{ matrix.edition == 'pro' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          # Install layout = what the user copies into OBS.
          cmake --install build --config Release --prefix pkg
          name="model600-${{ runner.os }}-${{ matrix.edition }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            bin=pkg/model600.plugin/Contents/MacOS/model600
            lipo -info "$bin" build/m600_test_dsp
            file "$bin" | grep -q "bundle" || { echo "not an MH_BUNDLE"; exit 1; }
            plutil -lint pkg/model600.plugin/Contents/Info.plist
            plutil -p pkg/model600.plugin/Contents/Info.plist
            # Ad-hoc signature over the whole bundle (no Developer ID yet).
            codesign --force --sign - pkg/model600.plugin
            codesign --verify --strict --verbose=2 pkg/model600.plugin
            cp install_mac.command pkg/
            (cd pkg && ditto -c -k --keepParent model600.plugin "../dist/$name.zip" \
              && zip -q "../dist/$name.zip" install_mac.command)
          else
            ls -l pkg/obs-plugins/64bit/model600.dll
            (cd pkg && 7z a -tzip "../dist/$name.zip" obs-plugins >/dev/null)
          fi
          unzip -l "dist/$name.zip"

      - name: Render GUI samples
        if: matrix.edition == 'pro'
        shell: bash
        env:
          QT_SCALE_FACTOR: '2'
        run: |
          sdk="$OBS_SDK"
          if [ "$RUNNER_OS" = "Windows" ]; then sdk="$(cygpath -u "$OBS_SDK")"; fi
          export PATH="$sdk/qt6/bin:$sdk/deps/bin:$PATH"
          export QT_PLUGIN_PATH="$OBS_SDK/qt6/plugins"
          # Prefer the headless platform plugin when the obs-deps Qt ships it.
          if ls "$sdk"/qt6/plugins/platforms/*offscreen* >/dev/null 2>&1; then export QT_QPA_PLATFORM=offscreen; fi
          if [ -f build/Release/m600_render_gui_samples.exe ]; then
            ./build/Release/m600_render_gui_samples.exe gui-samples-out
          else
            ./build/m600_render_gui_samples gui-samples-out
          fi

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: model600-${{ runner.os }}-${{ matrix.edition }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload GUI samples
        if: matrix.edition == 'pro'
        uses: actions/upload-artifact@v4
        with:
          name: gui-samples-${{ runner.os }}
          path: gui-samples-out/*.png
