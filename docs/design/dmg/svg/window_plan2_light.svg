, 'Noto Sans CJK JP'" font-weight="700" font-size="12" letter-spacing="0" fill="#0E1012">1</text><text x="350" y="114" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="500" font-size="12" letter-spacing="0" fill="#E7E9EC">Finder で ⇧⌘G（フォルダへ移動）を押す</text><text x="350" y="130" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="400" font-size="10.5" letter-spacing="0" fill="#AEB4BB">In Finder press ⇧⌘G (Go to Folder)</text><circle cx="332" cy="154" r="10" fill="#F0A33A"/><text x="332" y="158" text-anchor="middle" font-family="Inter, 'Noto Sans CJK JP'" font-weight="700" font-size="12" letter-spacing="0" fill="#0E1012">2</text><text x="350" y="158" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="500" font-size="12" letter-spacing="0" fill="#E7E9EC">次のパスを入力して開く</text><text x="350" y="174" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="400" font-size="10.5" letter-spacing="0" fill="#AEB4BB">Enter this path and open it</text><rect x="350" y="184" width="270" height="40" rx="6" fill="#262B31"/><text x="360" y="200" text-anchor="start" font-family="'DejaVu Sans Mono', monospace" font-weight="400" font-size="11" letter-spacing="0" fill="#F0A33A">~/Library/Application Support/</text><text x="360" y="216" text-anchor="start" font-family="'DejaVu Sans Mono', monospace" font-weight="400" font-size="11" letter-spacing="0" fill="#F0A33A">obs-studio/plugins</text><circle cx="332" cy="244" r="10" fill="#F0A33A"/><text x="332" y="248" text-anchor="middle" font-family="Inter, 'Noto Sans CJK JP'" font-weight="700" font-size="12" letter-spacing="0" fill="#0E1012">3</text><text x="350" y="248" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="500" font-size="12" letter-spacing="0" fill="#E7E9EC">開いたフォルダへ plugin をドラッグ</text><text x="350" y="264" text-anchor="start" font-family="Inter, 'Noto Sans CJK JP'" font-weight="400" font-size="10.5" letter-spacing="0" fill="#AEB4BB">